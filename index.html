<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agentic Design Knowledge Base</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-plugin-search@1/dist/search.min.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Agentic Design Knowledge Base",
      repo: "https://github.com/abbimarz/agentic-design-kb",
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      search: {
        paths: "auto",
        placeholder: "Search the knowledge base...",
        noData: "No results.",
      },
      plugins: [
        function (hook, vm) {
          var lastUpdatedPromise = fetch("_last-updated.json")
            .then((res) => res.json())
            .catch(() => ({}));

          hook.doneEach(function () {
            lastUpdatedPromise.then((map) => {
              var file = vm.route.file;
              var date = map[file];
              if (!date) return;

              var section = document.querySelector(".markdown-section");
              if (!section) return;

              var footer = document.createElement("p");
              footer.textContent = "Last updated: " + date;
              footer.style.cssText =
                "color:#999;font-size:0.85em;margin-top:3em;padding-top:0.8em;border-top:1px solid #eee;";
              section.appendChild(footer);
            });
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-search@1"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
